# VLAFlow paper-default recipe; resource paths are supplied by the run script.
run_id: mindlwpi_compressed_libero_finetune
run_root_dir: outputs
seed: 42
trackers:
- jsonl
version_id: '0.1'
framework:
  name: MindLWPI_Compressed
  qwenvl:
    base_vlm: models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    num_queries: 0
  action_model:
    action_dim: 14
    state_dim: 14
    future_action_window_size: 15
    past_action_window_size: 0
    action_horizon: 16
    action_hidden_dim: 1280
    dit_num_layers: 36
    dit_num_heads: 16
    dit_num_key_value_heads: 8
    dit_head_dim: 128
    dit_rope_theta: 10000.0
    vlm_kv_layer_offset: null
    latent_compress_ratio: 4
    latent_compress_method: avgpool
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    repeated_diffusion_steps: 4
    num_target_vision_tokens: 32
    add_pos_embed: true
    action_head_type: dit
    action_loss_weight: 1.0
  latent_extractor:
    latent_type: vjepa
    encoder_path: models/vjepa2-vitl-fpc16-256
    latent_loss_weight: 0.1
  enable_lang_action: false
  lang_action_format: verbose
  include_rotation: true
  vla0_num_bins: 1000
  detach_action_kv: false
  lang_action_loss_weight: 0.0
  global_norm_stats_path: null
  use_state: false
datasets:
  vla_data:
    dataset_py: lerobot_wm_datasets
    data_root_dir: data/finetune
    data_mix: libero_all_14d_wm
    action_type: delta_qpos
    sequential_step_sampling: false
    default_image_resolution:
    - 3
    - 224
    - 224
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av
    future_frame_offset: 8
    balance_dataset_weights: true
    balance_trajectory_weights: true
    num_workers: 4
    prefetch_factor: 2
    pin_memory: false
    persistent_workers: false
trainer:
  epochs: 3
  max_train_steps: 100000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  max_grad_norm: 1.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
paper_global_batch_size: 128
